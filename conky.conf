conky.config = {
    alignment = 'top_right',
    own_window_type = 'desktop',
    double_buffer = true,
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'grey',
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    use_xft = true,
    font = 'sans-serif:style=Normal:size=11',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 200,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_stderr = false,
    extra_newline = false,
    stippled_borders = 0,
    update_interval = 10,
    update_interval_on_battery = 60,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
}

conky.text = [[
${color yellow}システム$hr${color}
 ${color orange}${acpitemp}℃${color}	Uptime: $uptime
 ${freq}MHz	${color yellow}$cpu%	${color orange}${execi 60 sensors|grep "Package id 0"|awk '{print $4}'}${color}
 Memory ${color yellow}$memperc%${color}	$mem/$memmax
 Swap ${color yellow}$swapperc%${color}	$swap/$swapmax
 SSD ${color yellow}${fs_used_perc /}%${color}	${fs_used /}/${fs_size /}
 HDD ${color yellow}${fs_used_perc /home}%${color}	${fs_used /home}/${fs_size /home}
 ${addr eth0}
 ${wireless_essid wlan0} ${color yellow}${wireless_link_qual_perc wlan0}%${color}	${addr wlan0}
${color yellow}大気質$hr
${execpi 3600 python3 .config/conky/aqi.py}
${color yellow}カレンダー$hr${color}
#${font monospace:size=11}${alignc}${exec cal}${font}
#${execpi 600 calcurse -C .config/calcurse-radio -D .local/share/calcurse-radio -n}
${execi 600 calcurse --output-datefmt %x%A -a}
${execi 600 calcurse -t}
${color yellow}メール$hr${color}
新着${new_mails /var/spool/mail/$USER}件 / 全て${mails /var/spool/mail/$USER}件
${execi 600 mailx -H}
]]
