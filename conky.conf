conky.config = {
    alignment = 'top_right',
    own_window_type = 'desktop',
    double_buffer = true,
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'grey',
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    use_xft = true,
    font = 'sans-serif:style=Normal:size=11',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 200,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_stderr = false,
    extra_newline = false,
    stippled_borders = 0,
    update_interval = 10,
    update_interval_on_battery = 60,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
}

conky.text = [[
${color yellow}カレンダー$hr${color white}
${font monospace:size=11}${alignc}${exec cal}${font sans-serif:size=11}
${execpi 600 calcurse --output-datefmt %x%A -a}
